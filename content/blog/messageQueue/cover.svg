<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="消息队列：生产者、Broker、消费者示意图">
  <defs>
    <linearGradient id="mqCoverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f6ff"/>
      <stop offset="55%" stop-color="#e9e8ff"/>
      <stop offset="100%" stop-color="#fdeaf4"/>
    </linearGradient>
    <marker id="mqCoverArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6fe0"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#mqCoverBg)"/>
  <circle cx="712" cy="92" r="118" fill="#b9b6ff" opacity="0.3"/>
  <circle cx="76" cy="524" r="138" fill="#ffc6de" opacity="0.28"/>

  <text x="400" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#3b3f9e">Message Queue</text>
  <text x="400" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6a6ea8">异步 · 解耦 · 削峰</text>

  <!-- producer -->
  <g>
    <rect x="56" y="250" width="152" height="100" rx="18" fill="#ffffff" stroke="#4f6ef7" stroke-width="2.4"/>
    <text x="132" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#2f3fa8">生产者</text>
    <text x="132" y="326" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6f76b4">Producer</text>
  </g>

  <!-- broker -->
  <g>
    <rect x="268" y="164" width="264" height="272" rx="24" fill="#ffffff" opacity="0.72" stroke="#8b5cf6" stroke-width="2.4" stroke-dasharray="9 7"/>
    <text x="400" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#7c3aed">Broker</text>

    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#8a63d2">
      <g>
        <rect x="292" y="216" width="216" height="54" rx="14" fill="#f6f2ff" stroke="#a98bf0" stroke-width="1.8"/>
        <text x="308" y="249">Partition 0</text>
        <circle cx="424" cy="243" r="8" fill="#8b5cf6"/>
        <circle cx="450" cy="243" r="8" fill="#8b5cf6" opacity="0.6"/>
        <circle cx="476" cy="243" r="8" fill="#8b5cf6" opacity="0.35"/>
      </g>
      <g>
        <rect x="292" y="282" width="216" height="54" rx="14" fill="#f6f2ff" stroke="#a98bf0" stroke-width="1.8"/>
        <text x="308" y="315">Partition 1</text>
        <circle cx="424" cy="309" r="8" fill="#8b5cf6" opacity="0.5"/>
        <circle cx="450" cy="309" r="8" fill="#8b5cf6" opacity="0.3"/>
        <circle cx="476" cy="309" r="8" fill="#8b5cf6" opacity="0.2"/>
      </g>
      <g>
        <rect x="292" y="348" width="216" height="54" rx="14" fill="#f6f2ff" stroke="#a98bf0" stroke-width="1.8"/>
        <text x="308" y="381">Partition 2</text>
        <circle cx="424" cy="375" r="8" fill="#8b5cf6" opacity="0.55"/>
        <circle cx="450" cy="375" r="8" fill="#8b5cf6" opacity="0.35"/>
        <circle cx="476" cy="375" r="8" fill="#8b5cf6" opacity="0.2"/>
      </g>
    </g>
  </g>

  <!-- consumer -->
  <g>
    <rect x="592" y="250" width="152" height="100" rx="18" fill="#ffffff" stroke="#4f6ef7" stroke-width="2.4"/>
    <text x="668" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#2f3fa8">消费者</text>
    <text x="668" y="326" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6f76b4">Consumer</text>
  </g>

  <!-- links -->
  <g stroke="#6b6fe0" stroke-width="2.6" fill="none" marker-end="url(#mqCoverArrow)">
    <line x1="214" y1="300" x2="264" y2="300"/>
    <line x1="536" y1="300" x2="586" y2="300"/>
  </g>

  <g>
    <circle cx="240" cy="300" r="9" fill="#4f6ef7"/>
    <circle cx="564" cy="300" r="9" fill="#4f6ef7"/>
  </g>

  <text x="400" y="500" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6a6ea8">顺序写 · 页缓存 · 零拷贝 · 多副本</text>
  <text x="400" y="534" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6a6ea8">至少一次 + 幂等</text>
</svg>
