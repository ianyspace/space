<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="MySQL 面试全攻略：七章路线图，索引一章为重点">
  <defs>
    <linearGradient id="miCoverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eefaf8"/>
      <stop offset="52%" stop-color="#e8f3fb"/>
      <stop offset="100%" stop-color="#fff6ec"/>
    </linearGradient>
    <linearGradient id="miCoverSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e8a8a"/>
      <stop offset="70%" stop-color="#3f9bb8"/>
      <stop offset="100%" stop-color="#e08a1e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#miCoverBg)"/>
  <circle cx="716" cy="74" r="122" fill="#8fded4" opacity="0.3"/>
  <circle cx="70" cy="540" r="140" fill="#f8c98a" opacity="0.26"/>

  <text x="400" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#0d5c6b">MySQL</text>
  <text x="400" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#4f7f8c">面试全攻略 · 从架构到 SQL 优化</text>

  <line x1="64" y1="176" x2="64" y2="488" stroke="url(#miCoverSpine)" stroke-width="3" opacity="0.5"/>

  <!-- 1 架构 -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="154" width="674" height="44" rx="10" fill="#ffffff" opacity="0.84" stroke="#a9d8d3" stroke-width="1.4"/>
    <circle cx="64" cy="176" r="15" fill="#0e7c86"/>
    <text x="64" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="118" y="181" font-size="15" font-weight="600" fill="#0d5c6b">架构与存储引擎</text>
    <text x="752" y="180" text-anchor="end" font-size="11.5" fill="#8aa2a8">三层架构 · 一条 SQL 的一生</text>
  </g>

  <!-- 2 索引（重点） -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="206" width="674" height="44" rx="10" fill="#fff4e3" stroke="#efc084" stroke-width="1.6"/>
    <circle cx="64" cy="228" r="15" fill="#e07b13"/>
    <text x="64" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="118" y="233" font-size="15" font-weight="700" fill="#a15c0a">索引 · 核心重点</text>
    <text x="752" y="232" text-anchor="end" font-size="11.5" fill="#b8813a">B+ 树 · 最左前缀 · 回表 · 索引失效</text>
  </g>

  <!-- 3 事务 -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="258" width="674" height="44" rx="10" fill="#ffffff" opacity="0.84" stroke="#a9d8d3" stroke-width="1.4"/>
    <circle cx="64" cy="280" r="15" fill="#0e7c86"/>
    <text x="64" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="118" y="285" font-size="15" font-weight="600" fill="#0d5c6b">事务</text>
    <text x="752" y="284" text-anchor="end" font-size="11.5" fill="#8aa2a8">ACID 的实现 · 四种隔离级别</text>
  </g>

  <!-- 4 MVCC -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="310" width="674" height="44" rx="10" fill="#ffffff" opacity="0.84" stroke="#a9d8d3" stroke-width="1.4"/>
    <circle cx="64" cy="332" r="15" fill="#0e7c86"/>
    <text x="64" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="118" y="337" font-size="15" font-weight="600" fill="#0d5c6b">MVCC</text>
    <text x="752" y="336" text-anchor="end" font-size="11.5" fill="#8aa2a8">隐藏字段 · 版本链 · Read View</text>
  </g>

  <!-- 5 锁 -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="362" width="674" height="44" rx="10" fill="#ffffff" opacity="0.84" stroke="#a9d8d3" stroke-width="1.4"/>
    <circle cx="64" cy="384" r="15" fill="#0e7c86"/>
    <text x="64" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="118" y="389" font-size="15" font-weight="600" fill="#0d5c6b">锁机制</text>
    <text x="752" y="388" text-anchor="end" font-size="11.5" fill="#8aa2a8">记录锁 · 间隙锁 · 死锁排查</text>
  </g>

  <!-- 6 日志 -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="414" width="674" height="44" rx="10" fill="#ffffff" opacity="0.84" stroke="#a9d8d3" stroke-width="1.4"/>
    <circle cx="64" cy="436" r="15" fill="#0e7c86"/>
    <text x="64" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
    <text x="118" y="441" font-size="15" font-weight="600" fill="#0d5c6b">日志系统</text>
    <text x="752" y="440" text-anchor="end" font-size="11.5" fill="#8aa2a8">redo · binlog · 两阶段提交</text>
  </g>

  <!-- 7 SQL 优化 -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="96" y="466" width="674" height="44" rx="10" fill="#ffffff" opacity="0.84" stroke="#a9d8d3" stroke-width="1.4"/>
    <circle cx="64" cy="488" r="15" fill="#0e7c86"/>
    <text x="64" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7</text>
    <text x="118" y="493" font-size="15" font-weight="600" fill="#0d5c6b">SQL 优化</text>
    <text x="752" y="492" text-anchor="end" font-size="11.5" fill="#8aa2a8">EXPLAIN · 深分页 · count 的区别</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="197" y="536" width="122" height="34" rx="17" fill="#ffffff" opacity="0.86" stroke="#a9d8d3"/>
    <text x="258" y="558" text-anchor="middle" fill="#0d5c6b">面试实战</text>
    <rect x="339" y="536" width="122" height="34" rx="17" fill="#ffffff" opacity="0.86" stroke="#a9d8d3"/>
    <text x="400" y="558" text-anchor="middle" fill="#0d5c6b">速查表</text>
    <rect x="481" y="536" width="122" height="34" rx="17" fill="#ffffff" opacity="0.86" stroke="#efc084"/>
    <text x="542" y="558" text-anchor="middle" fill="#a15c0a">追问链</text>
  </g>
</svg>
