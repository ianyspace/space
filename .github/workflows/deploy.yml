name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow a single concurrent deployment, but never cancel one that is already
# publishing — that would leave Pages half deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `output: 'export'` (see next.config.js) makes `next build` emit the whole
      # static site into `out/`, which is what GitHub Pages serves.
      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
          # The Mapbox token is not committed (push protection rejects it), so it
          # is injected here. Set it under
          # Settings -> Secrets and variables -> Actions as `NEXT_PUBLIC_MAPBOX_TOKEN`
          # (a Secret or a Variable both work).
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || vars.NEXT_PUBLIC_MAPBOX_TOKEN }}

      # GitHub Pages would otherwise run Jekyll, which silently drops files and
      # directories starting with an underscore — including `_next/`.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Pages must be switched on once by hand:
        #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
        # Creating the site through the API (`enablement: true`) fails with
        # "Resource not accessible by integration" (that call needs repository
        # admin rights, which the workflow token does not have), so this step only
        # reads the configuration that is already there.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    needs: build
    # Only ever publish a build that came from `master`. A manual
    # `workflow_dispatch` started from `master` is allowed too: with the previous
    # `github.event_name == 'push'` check, a manual run built the site, uploaded
    # the artifact and then silently skipped this job, which left Pages at 404.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages backend occasionally stalls. With the defaults (10 min /
          # 10 errors) the action gives up, and a timed-out deployment can be left
          # behind stuck in "in progress" — which then blocks *every* later
          # deployment with:
          #   "Deployment request failed ... due to in progress deployment.
          #    Please cancel <sha> first or wait for it to complete."
          # Give the backend a lot more room so a slow run is ridden out instead.
          timeout: 1800000 # 30 min
          error_count: 30
          reporting_interval: 15000 # 15 s
